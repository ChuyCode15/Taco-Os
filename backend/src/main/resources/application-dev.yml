spring:
  datasource:
    url: jdbc:h2:mem:tacoosdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    locations: classpath:db/migrations
    baseline-on-migrate: true

  security:
    user:
      name: none
      password: none

jwt:
  secret: TacoOs2025SecretKeyForJwtTokenGenerationAndValidationP455w0rd
  expiration-ms: 3600000

